        <!-- Hidden Node for measurement -->

        <!-- Export UI -->

    <script>
        // --- Core State ---
        const INITIAL_TEXT = `在这个信息爆炸的时代，如何让你的文字在社交媒体上脱颖而出？\n\n长文往往让人望而生畏，而精美的图片卡片则是解决阅读压力的最佳方案。这就是“Note-IMG”诞生的初衷：将你的思想碎片，转化为视觉上的享受。\n\n我们采用了“段落块”分页引擎，文字绝对不会在句子中间被切断。点击下方的推拉按钮，即可在页面间自由穿梭段落。\n\n卡片支持自动垂直伸长。如果内容拉入过多，卡片会自适应调整，确保所有文字均有舒适的生存空间。\n\n我们根据苹果设计规范深度重构了页脚层级，优先突出您的自定义信息，并将品牌标识与页码收敛于极简的注脚空间。\n\n自由调节字号、行距、字间距与段落间距。愿您的每一段思想，都能找到最美的容器。`;

        let settings = {
            fontSize: 18,
            lineHeight: 1.6,
            letterSpacing: 0.5,
            paragraphSpacing: 16,
            bgColor: '#F9F4E8',
            theme: 'beige',
            textAlign: 'left',
            watermark: 'Note-IMG DIY Creation',
            cardWidth: 360,
            standardHeight: 480
        };

        let pages = []; 
        let isEditing = true;

        const inputTextEl = document.getElementById('inputText');
        const cardsContainer = document.getElementById('cardsContainer');
        const measurementNode = document.getElementById('measurementNode');
        const exportOverlay = document.getElementById('exportOverlay');
        const toggleEditBtn = document.getElementById('toggleEditBtn');
        const watermarkInput = document.getElementById('watermarkInput');
        const sidebar = document.getElementById('sidebar');

        function paginate() {
            const text = inputTextEl.value;
            const rawParagraphs = text.split('\n').filter(p => p.trim().length > 0);
            const processedChunks = [];

            rawParagraphs.forEach(p => {
                if (p.length > 500) {
                    const sentences = p.split(/([。！？；]|\. |\! |\? )/g);
                    let temp = "";
                    for (let i = 0; i < sentences.length; i++) {
                        temp += sentences[i];
                        if (i % 2 !== 0 || i === sentences.length - 1) {
                            processedChunks.push(temp);
                            temp = "";
                        }
                    }
                } else {
                    processedChunks.push(p);
                }
            });

            measurementNode.style.fontSize = `${settings.fontSize}px`;
            measurementNode.style.lineHeight = settings.lineHeight;
            measurementNode.style.letterSpacing = `${settings.letterSpacing}px`;
            measurementNode.style.width = `${settings.cardWidth - 80}px`;

            const newPages = [[]];
            let currentPageIdx = 0;
            const effectiveMaxHeight = settings.standardHeight - 80; // Optimized space further

            processedChunks.forEach(chunk => {
                const currentPageContent = newPages[currentPageIdx];
                const testContent = [...currentPageContent, chunk];
                measurementNode.innerHTML = testContent.map(c => 
                    `<div style="margin-bottom: ${settings.paragraphSpacing}px">${c}</div>`
                ).join('');

                if (measurementNode.offsetHeight > effectiveMaxHeight && currentPageContent.length > 0) {
                    currentPageIdx++;
                    newPages[currentPageIdx] = [chunk];
                } else {
                    newPages[currentPageIdx].push(chunk);
                }
            });

            pages = newPages;
            render();
        }

        function handlePush(idx) {
            if (idx >= pages.length - 1 && pages[idx].length <= 1) return;
            const block = pages[idx].pop();
            if (block) {
                if (!pages[idx + 1]) pages[idx+1] = [];
                pages[idx + 1].unshift(block);
                if (pages[idx].length === 0) pages.splice(idx, 1);
                render();
            }
        }

        function handlePull(idx) {
            if (idx >= pages.length - 1) return;
            const block = pages[idx+1].shift();
            if (block) {
                pages[idx].push(block);
                if (pages[idx + 1].length === 0) pages.splice(idx+1, 1);
                render();
            }
        }

        function render() {
            cardsContainer.innerHTML = '';

            pages.forEach((paragraphs, idx) => {
                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'relative group w-full max-w-[360px]';

                const card = document.createElement('div');
                card.className = 'export-card rounded-sm flex flex-col transition-all overflow-hidden';
                card.style.backgroundColor = settings.bgColor;
                card.style.width = `${settings.cardWidth}px`;
                card.style.minHeight = `${settings.standardHeight}px`;
                card.style.height = 'auto';
                card.style.padding = '55px 40px 32px 40px'; 

                const content = document.createElement('div');
                content.className = 'chinese-serif flex-1 outline-none';
                content.contentEditable = true;
                content.style.fontSize = `${settings.fontSize}px`;
                content.style.lineHeight = settings.lineHeight;
                content.style.letterSpacing = `${settings.letterSpacing}px`;
                content.style.textAlign = settings.textAlign;
                content.style.color = '#1a1a1a';

                paragraphs.forEach(p => {
                    const pDiv = document.createElement('div');
                    pDiv.style.marginBottom = `${settings.paragraphSpacing}px`;
                    pDiv.innerText = p;
                    content.appendChild(pDiv);
                });

                // Footer - Apple Designer Refinement
                // Hierarchical structure: User Watermark (Top), Brand + Page (Bottom)
                const footer = document.createElement('div');
                footer.className = 'mt-10 pt-4 flex flex-col gap-3 relative';
                
                // Fine divider - subtle hairline
                const divider = document.createElement('div');
                divider.className = 'absolute top-0 left-0 right-0 h-[0.5px] bg-black/[0.04]';
                footer.appendChild(divider);

                footer.innerHTML += `
                    <!-- Level 1: Primary focus (User editable watermark) -->
                    <div class="chinese-sans text-[11px] text-slate-800 font-medium tracking-tight leading-snug">
                        ${settings.watermark}
                    </div>
                    <!-- Level 2: Metadata (Tool ID and Page number) -->
                    <div class="flex justify-between items-end">
                        <span class="text-[8.5px] font-medium text-slate-300 tracking-[0.35em] uppercase chinese-sans leading-none">Note-IMG</span>
                        <span class="text-[13px] font-bold text-slate-900 tracking-[-0.01em] chinese-sans leading-none">${String(idx + 1).padStart(2, '0')}</span>
                    </div>
                `;

                card.appendChild(content);
                card.appendChild(footer);
                cardWrapper.appendChild(card);

                // Adjuster UI
                if (pages.length > 1) {
                    const adjusters = document.createElement('div');
                    adjusters.className = 'absolute -bottom-10 left-1/2 -translate-x-1/2 flex items-center gap-4 z-20 opacity-0 group-hover:opacity-100 transition-all scale-95 group-hover:scale-100';
                    
                    const pushBtn = document.createElement('button');
                    pushBtn.className = 'bg-white/80 backdrop-blur shadow-xl border border-slate-100 p-2.5 rounded-full text-slate-400 hover:text-slate-900 transition-all active:scale-90';
                    pushBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
                    pushBtn.onclick = () => handlePush(idx);

                    const pullBtn = document.createElement('button');
                    pullBtn.className = 'bg-white/80 backdrop-blur shadow-xl border border-slate-100 p-2.5 rounded-full text-slate-400 hover:text-slate-900 transition-all active:scale-90';
                    pullBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>';
                    pullBtn.onclick = () => handlePull(idx);

                    adjusters.appendChild(pushBtn);
                    const gap = document.createElement('div');
                    gap.className = 'h-px w-6 bg-slate-200/50';
                    adjusters.appendChild(gap);
                    adjusters.appendChild(pullBtn);
                    cardWrapper.appendChild(adjusters);
                }

                cardsContainer.appendChild(cardWrapper);
            });
        }

        async function exportImages() {
            exportOverlay.classList.remove('hidden');
            const cards = document.querySelectorAll('.export-card');
            try {
                for (let i = 0; i < cards.length; i++) {
                    const canvas = await html2canvas(cards[i], {
                        scale: 3,
                        useCORS: true,
                        backgroundColor: settings.bgColor,
                    });
                    const link = document.createElement('a');
                    link.download = `NoteIMG_Creation_${i + 1}.png`;
                    link.href = canvas.toDataURL('image/png', 1.0);
                    link.click();
                }
            } catch (err) {
                console.error(err);
            } finally {
                exportOverlay.classList.add('hidden');
            }
        }

        // Init & Control Bindings
        inputTextEl.oninput = paginate;
        watermarkInput.oninput = (e) => {
            settings.watermark = e.target.value;
            render();
        };

        document.getElementById('fontSize').oninput = (e) => {
            settings.fontSize = parseInt(e.target.value);
            document.getElementById('fontSizeVal').innerText = settings.fontSize;
            paginate();
        };
        document.getElementById('lineHeight').oninput = (e) => {
            settings.lineHeight = parseFloat(e.target.value);
            document.getElementById('lineHeightVal').innerText = settings.lineHeight;
            paginate();
        };
        document.getElementById('letterSpacing').oninput = (e) => {
            settings.letterSpacing = parseFloat(e.target.value);
            document.getElementById('letterSpacingVal').innerText = settings.letterSpacing;
            paginate();
        };
        document.getElementById('paraSpacing').oninput = (e) => {
            settings.paragraphSpacing = parseInt(e.target.value);
            document.getElementById('paraSpacingVal').innerText = settings.paragraphSpacing;
            paginate();
        };

        document.querySelectorAll('.alignBtn').forEach(btn => {
            btn.onclick = () => {
                settings.textAlign = btn.dataset.align;
                document.querySelectorAll('.alignBtn').forEach(b => {
                    b.classList.remove('border-slate-800', 'bg-slate-50', 'text-slate-800');
                    b.classList.add('border-slate-50', 'text-slate-400');
                });
                btn.classList.add('border-slate-800', 'bg-slate-50', 'text-slate-800');
                btn.classList.remove('border-slate-50', 'text-slate-400');
                render();
            };
        });

        document.querySelectorAll('.themeBtn').forEach(btn => {
            btn.onclick = () => {
                settings.bgColor = btn.dataset.color;
                settings.theme = btn.dataset.theme;
                document.querySelectorAll('.themeBtn').forEach(b => {
                    b.classList.remove('border-slate-800', 'scale-105');
                    b.classList.add('border-slate-50');
                });
                btn.classList.add('border-slate-800', 'scale-105');
                btn.classList.remove('border-slate-50');
                render();
            };
        });

        toggleEditBtn.onclick = () => {
            isEditing = !isEditing;
            const toggleIcon = document.getElementById('toggleIcon');
            const toggleText = document.getElementById('toggleText');
            
            if (isEditing) {
                sidebar.classList.remove('hidden');
                toggleText.innerText = '完成设定';
                toggleEditBtn.classList.remove('bg-white', 'text-slate-600');
                toggleEditBtn.classList.add('bg-slate-100', 'text-slate-900');
            } else {
                sidebar.classList.add('hidden');
                toggleText.innerText = '修改样式';
                toggleEditBtn.classList.add('bg-white', 'text-slate-600');
                toggleEditBtn.classList.remove('bg-slate-100', 'text-slate-900');
            }
        };

        document.getElementById('exportBtn').onclick = exportImages;

        // Start
        inputTextEl.value = INITIAL_TEXT;
        paginate();
    </script>
</body>
</html>
